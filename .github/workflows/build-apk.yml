name: Build Trucker Find APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test voice commands
        run: |
          javac -d build/voice-tests app/src/main/java/co/median/android/TruckerFindVoiceCommands.java tests/TruckerFindVoiceCommandsTest.java
          java -cp build/voice-tests co.median.android.TruckerFindVoiceCommandsTest
          node --test tests/saved-voice.test.cjs

      - name: Build debug APK
        run: ./gradlew assembleNormalDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trucker-Find-Debug-APK
          path: app/build/outputs/apk/normal/debug/*.apk
          if-no-files-found: error
