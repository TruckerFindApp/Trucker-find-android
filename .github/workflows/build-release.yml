name: Build Trucker Find Play Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test voice controls
        run: |
          javac -d build/voice-tests app/src/main/java/co/median/android/TruckerFindVoiceCommands.java tests/TruckerFindVoiceCommandsTest.java
          java -cp build/voice-tests co.median.android.TruckerFindVoiceCommandsTest
          node --test tests/saved-voice.test.cjs
      - name: Restore private upload key
        env:
          UPLOAD_KEY: ${{ secrets.TRUCKER_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$UPLOAD_KEY" || { echo 'Missing upload signing key'; exit 1; }
          umask 077
          printf '%s' "$UPLOAD_KEY" | base64 --decode > "$RUNNER_TEMP/trucker-upload.p12"
      - name: Build signed App Bundle and release test APK
        env:
          TRUCKER_UPLOAD_STORE_FILE: ${{ runner.temp }}/trucker-upload.p12
          TRUCKER_UPLOAD_STORE_PASSWORD: ${{ secrets.TRUCKER_UPLOAD_STORE_PASSWORD }}
          TRUCKER_UPLOAD_KEY_PASSWORD: ${{ secrets.TRUCKER_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleNormalRelease assembleNormalRelease --stacktrace
          jarsigner -verify app/build/outputs/bundle/normalRelease/app-normal-release.aab
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: Trucker-Find-Play-Release
          path: |
            app/build/outputs/bundle/normalRelease/*.aab
            app/build/outputs/apk/normal/release/*.apk
            app/build/outputs/mapping/normalRelease/mapping.txt
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/trucker-upload.p12"
